<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef0ff" />
    <meta name="description" content="Make words stick! Your little companion for learning words." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mempo</title>
    <script>
      // Dark mode before the first paint, so the page doesn't flash light. Same rule as src/lib/theme.ts;
      // "mempo" is site.storageKey in src/config/site.ts.
      try {
        var t = ((JSON.parse(localStorage.getItem("mempo:progress") || "{}") || {}).settings || {}).theme;
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#15122e");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
